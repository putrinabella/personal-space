<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nana Update Kedua — Detail Produk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f1ef;
    --paper:#fbf6f4;
    --surface:#ffffff;
    --ink:#2a1b22;
    --ink-soft:#7a6169;
    --ink-faint:#a9939a;
    --berry:#7d2447;
    --berry-deep:#5c1834;
    --berry-soft:#f4d9e1;
    --sage:#6f8a45;
    --sage-soft:#e7efd8;
    --amber:#b4700f;
    --amber-soft:#faead0;
    --red:#a83636;
    --red-soft:#f6dcdc;
    --line:#ecdfe1;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --shadow: 0 1px 2px rgba(42,27,34,.04), 0 12px 28px -14px rgba(93,24,52,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #fdf1ee 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: clamp(14px, 4vw, 36px) clamp(12px, 4vw, 36px) 40px;
  }

  .page{ width:100%; max-width:440px; }

  .card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    overflow:hidden;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:22px 20px 18px;
    background:
      radial-gradient(120% 140% at 100% 0%, #fbeef1 0%, transparent 55%),
      linear-gradient(180deg,#fffdfc 0%, var(--paper) 100%);
    border-bottom:1px solid var(--line);
  }
  .hero-top{ display:flex; align-items:flex-start; gap:14px; }
  .cat-badge{
    flex:0 0 auto;
    width:52px; height:52px;
    border-radius:16px;
    background: linear-gradient(155deg, #d7e8b3, #c5e384 65%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), 0 6px 14px -8px rgba(111,138,69,.6);
  }
  .cat-badge svg{ width:26px; height:26px; }

  .hero-text{ flex:1; min-width:0; }
  .eyebrow{
    font-size:11.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--sage); font-weight:700; margin:2px 0 4px;
  }
  h1.name{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-optical-sizing:auto;
    font-size: clamp(21px, 6vw, 25px);
    line-height:1.15;
    margin:0 0 8px;
    color:var(--berry-deep);
  }
  .meta-row{
    display:flex; flex-wrap:wrap; gap:6px 10px;
    font-size:13px; color:var(--ink-soft);
  }
  .meta-row span{ display:inline-flex; align-items:center; gap:5px; }
  .meta-row .dot::before{ content:"•"; color:var(--ink-faint); margin-right:4px; }

  .rating-row{
    margin-top:14px; display:flex; align-items:center; gap:8px;
  }
  .stars{ display:flex; gap:2px; }
  .stars svg{ width:16px; height:16px; }
  .rating-label{ font-size:12.5px; color:var(--ink-soft); font-weight:500; }

  /* ---------- ALERT ---------- */
  .alert{
    margin:16px 20px 0;
    background:var(--amber-soft);
    border:1px solid #f0d7ad;
    color:#7a4c0c;
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:12.5px;
    font-weight:600;
    display:flex; align-items:center; gap:8px;
    line-height:1.35;
  }
  .alert svg{ width:16px; height:16px; flex:0 0 auto; }

  /* ---------- STATS ---------- */
  .stats{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:16px 20px 4px;
  }
  .stat{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:10px 8px;
    text-align:center;
  }
  .stat .num{
    font-family:"Fraunces",serif; font-weight:600;
    font-size:20px; color:var(--berry-deep); line-height:1;
  }
  .stat .lbl{
    font-size:10.5px; color:var(--ink-soft); margin-top:5px;
    text-transform:uppercase; letter-spacing:.05em; font-weight:600;
  }

  /* ---------- SECTION ---------- */
  .section{ padding:18px 20px 4px; }
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:10px;
  }
  .section-title{
    font-size:13px; font-weight:700; letter-spacing:.03em;
    text-transform:uppercase; color:var(--ink);
  }
  .section-sub{ font-size:11.5px; color:var(--ink-faint); }

  /* ---------- UNIT LIST ---------- */
  .units{ display:flex; flex-direction:column; gap:8px; }
  .unit{
    position:relative;
    display:flex; flex-direction:column; gap:8px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:11px 12px 11px 14px;
  }
  .unit::before{
    content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px;
    border-radius:3px; background:var(--tone, var(--ink-faint));
  }
  .unit-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .unit-price{ font-weight:700; font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums; }
  .pill{
    font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:99px;
    background:var(--pill-bg,#eee); color:var(--pill-fg,#555);
    white-space:nowrap;
  }
  .unit-mid{ display:flex; flex-wrap:wrap; gap:6px 12px; font-size:11.5px; color:var(--ink-soft); }
  .unit-mid b{ color:var(--ink); font-weight:600; }
  .unit-expiry{
    font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:5px;
    color:var(--exp-fg,var(--ink-soft));
  }
  .unit-expiry svg{ width:13px; height:13px; }

  .pao{ margin-top:2px; }
  .pao-head{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-soft); margin-bottom:4px; }
  .pao-track{ height:5px; border-radius:99px; background:#e9dfe2; overflow:hidden; }
  .pao-fill{ height:100%; border-radius:99px; background:var(--sage); }
  .pao-fill.warn{ background:var(--red); }

  /* ---------- CONCERNS ---------- */
  .tags{ display:flex; flex-wrap:wrap; gap:7px; padding-bottom:4px; }
  .tag{
    font-size:12px; font-weight:600; color:var(--berry-deep);
    background:var(--berry-soft);
    border:1px solid #ecc6d3;
    padding:6px 11px; border-radius:99px;
  }

  /* ---------- CTA ---------- */
  .cta-wrap{ padding:18px 20px 20px; }
  .edit-btn{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(180deg,var(--berry), var(--berry-deep));
    color:#fff; border:none; border-radius:16px;
    font-family:"Inter"; font-size:15px; font-weight:700;
    padding:14px 16px; cursor:pointer;
    box-shadow:0 10px 20px -10px rgba(92,24,52,.55);
  }
  .edit-btn svg{ width:17px; height:17px; }
  .edit-btn:focus-visible, button:focus-visible{
    outline:2px solid var(--berry-deep); outline-offset:3px;
  }
  .edit-btn:active{ transform:translateY(1px); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  @media (min-width:460px){
    .hero{ padding:26px 26px 20px; }
    .stats,.section,.cta-wrap{ padding-left:26px; padding-right:26px; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="card" id="app"></div>
  </div>

<script>
const API = {
  data: {
    name: "Nana Update kedua",
    minStock: 9,
    rating: 2,
    quantity: 5,
    category: { name: "Toner & Essence", color: "#c5e384" },
    brand: { name: "Skinberries" },
    store: { name: "Shopee - SkinBerries Official Store" },
    units: [
      { id:"u1", status:"active",    price:300000,  purchaseDate:"2026-08-05", expiryDate:"2026-08-15", dateOpened:"2026-07-30", paoMonths:34, paoProgress:2 },
      { id:"u2", status:"finished",  price:3000000, purchaseDate:"2026-08-07", expiryDate:"2026-08-14", dateOpened:"2026-08-22", paoMonths:2,  paoProgress:3 },
      { id:"u3", status:"backup",    price:277777,  purchaseDate:"2026-08-20", expiryDate:"2026-08-29", dateOpened:null,        paoMonths:3,  paoProgress:null },
      { id:"u4", status:"discarded", price:300000,  purchaseDate:"2026-08-14", expiryDate:"2026-08-28", dateOpened:null,        paoMonths:2,  paoProgress:null },
      { id:"u5", status:"backup",    price:30000,   purchaseDate:"2026-08-01", expiryDate:"2026-08-19", dateOpened:null,        paoMonths:4,  paoProgress:null }
    ],
    concerns: ["Acne-Prone","Acne Scars","Body Hyperpigmentation","Back Acne","Frizzy Hair"]
  }
};

const rupiah = n => "Rp " + Number(n).toLocaleString("id-ID");
const fmtDate = iso => new Date(iso).toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" });
const daysBetween = iso => Math.round((new Date(iso) - new Date()) / 86400000);

const STATUS_LABEL = { active:"Dipakai", finished:"Habis", backup:"Cadangan", discarded:"Dibuang" };
const STATUS_COLOR = {
  active:    { bg:"#e7efd8", fg:"#4d6b26", tone:"#6f8a45" },
  finished:  { bg:"#ece3e6", fg:"#6b5460", tone:"#a9939a" },
  backup:    { bg:"#f4d9e1", fg:"#7d2447", tone:"#7d2447" },
  discarded: { bg:"#f6dcdc", fg:"#a83636", tone:"#a83636" }
};

function starsSVG(rating, max=5){
  let out = "";
  for(let i=1;i<=max;i++){
    const filled = i <= rating;
    out += `<svg viewBox="0 0 24 24" fill="${filled ? '#c98a1e' : 'none'}" stroke="${filled ? '#c98a1e' : '#d8c9ce'}" stroke-width="1.6">
      <path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.2-4.1 5.8-.8z" stroke-linejoin="round"/>
    </svg>`;
  }
  return out;
}

function expiryInfo(iso){
  const d = daysBetween(iso);
  if (d < 0) return { text:`Kedaluwarsa ${Math.abs(d)} hari lalu`, cls:"exp-bad", fg:"var(--red)" };
  if (d <= 7) return { text:`${d} hari lagi`, cls:"exp-warn", fg:"var(--amber)" };
  return { text:`${fmtDate(iso)}`, cls:"exp-ok", fg:"var(--sage)" };
}

function unitCard(u){
  const s = STATUS_COLOR[u.status];
  const exp = expiryInfo(u.expiryDate);
  let paoBlock = "";
  if (u.dateOpened && u.paoProgress != null){
    const pct = Math.min(100, Math.round((u.paoProgress / u.paoMonths) * 100));
    const over = u.paoProgress > u.paoMonths;
    paoBlock = `
      <div class="pao">
        <div class="pao-head">
          <span>Dibuka ${fmtDate(u.dateOpened)} · PAO ${u.paoMonths} bln</span>
          <span>${over ? "Lewat batas" : pct + "%"}</span>
        </div>
        <div class="pao-track"><div class="pao-fill ${over ? "warn" : ""}" style="width:${Math.min(100,pct)}%"></div></div>
      </div>`;
  }
  return `
    <div class="unit" style="--tone:${s.tone}">
      <div class="unit-top">
        <span class="unit-price">${rupiah(u.price)}</span>
        <span class="pill" style="--pill-bg:${s.bg}; --pill-fg:${s.fg}">${STATUS_LABEL[u.status]}</span>
      </div>
      <div class="unit-mid">
        <span>Dibeli <b>${fmtDate(u.purchaseDate)}</b></span>
      </div>
      <div class="unit-expiry" style="--exp-fg:${exp.fg}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2" stroke-linecap="round"/></svg>
        ${exp.text}
      </div>
      ${paoBlock}
    </div>`;
}

function render(){
  const d = API.data;
  const low = d.quantity < d.minStock;

  document.getElementById("app").innerHTML = `
    <div class="hero">
      <div class="hero-top">
        <div class="cat-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4d6b26" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3c1.8 1.8 1.8 4.6 0 6.4C10.2 7.6 10.2 4.8 12 3z"/>
            <path d="M12 3c-1.8 1.8-1.8 4.6 0 6.4"/>
            <path d="M4.5 9c2.5-.5 4.7.7 5.6 2.8-2.5.5-4.7-.7-5.6-2.8z"/>
            <path d="M19.5 9c-2.5-.5-4.7.7-5.6 2.8 2.5.5 4.7-.7 5.6-2.8z"/>
            <circle cx="12" cy="14.5" r="2.3"/>
            <path d="M12 16.8V21" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="hero-text">
          <div class="eyebrow">${d.category.name}</div>
          <h1 class="name">${d.name}</h1>
          <div class="meta-row">
            <span>${d.brand.name}</span>
            <span class="dot">${d.store.name}</span>
          </div>
        </div>
      </div>
      <div class="rating-row">
        <div class="stars">${starsSVG(d.rating)}</div>
        <span class="rating-label">${d.rating.toFixed(1)} / 5</span>
      </div>
    </div>

    ${low ? `
    <div class="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
      Stok menipis — tersisa ${d.quantity} dari minimal ${d.minStock} unit
    </div>` : ``}

    <div class="stats">
      <div class="stat"><div class="num">${d.quantity}</div><div class="lbl">Total unit</div></div>
      <div class="stat"><div class="num">${d.minStock}</div><div class="lbl">Min. stok</div></div>
      <div class="stat"><div class="num">${d.units.filter(u=>u.status==='active'||u.status==='backup').length}</div><div class="lbl">Siap pakai</div></div>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="section-title">Rincian unit</span>
        <span class="section-sub">${d.units.length} botol</span>
      </div>
      <div class="units">
        ${d.units.map(unitCard).join("")}
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="section-title">Skin concerns</span>
      </div>
      <div class="tags">
        ${d.concerns.map(c => `<span class="tag">${c}</span>`).join("")}
      </div>
    </div>

    <div class="cta-wrap">
      <button class="edit-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Edit Produk
      </button>
    </div>
  `;
}

render();
</script>
</body>
</html>
